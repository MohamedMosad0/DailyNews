  </g>
  <circle cx="152" cy="48" r="13" fill="url(#redDotGrad-vt-dark)" />
  <rect x="62" y="92" width="76" height="66" rx="8" fill="#121212" stroke="#FFFFFF" stroke-width="7" />
  <rect x="72" y="103" width="22" height="18" rx="3" fill="#E53935" />
  <rect x="99" y="104" width="28" height="5" rx="2.5" fill="#FFFFFF" />
  <rect x="99" y="114" width="22" height="4" rx="2" fill="#FFFFFF" opacity="0.75" />
  <rect x="72" y="127" width="55" height="4.5" rx="2" fill="#FFFFFF" opacity="0.9" />
