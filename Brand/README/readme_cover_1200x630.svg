  <rect x="72" y="127" width="55" height="4.5" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="72" y="136" width="46" height="4.5" rx="2" fill="#FFFFFF" opacity="0.7" />
  <rect x="72" y="145" width="38" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
</g>
  </g>

  <text x="350" y="210">
