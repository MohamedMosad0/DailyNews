    <circle cx="0" cy="0" r="220" fill="none" stroke="#E53935" stroke-width="2.5" stroke-dasharray="15 30" opacity="0.5"/>
  </g>

  <g transform="translate(120, 120) scale(1.0)">
    <g id="icon-mark-rm-cv">
  <defs>
